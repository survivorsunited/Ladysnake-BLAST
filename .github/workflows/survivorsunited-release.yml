name: SurvivorsUnited BLAST release

on:
  workflow_dispatch:
  push:
    branches:
      - 'survivorsunited/1.21'
    tags:
      - 'survivorsunited-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric mod
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon
      - name: Ensure distributable JAR exists
        run: |
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print | grep .
      - name: Upload distributable JAR
        uses: actions/upload-artifact@v4
        with:
          name: survivorsunited-blast-1.21.11
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/survivorsunited-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=()
          for file in build/libs/*.jar; do
            case "$file" in *-sources.jar|*-dev.jar) ;; *) files+=("$file");; esac
          done
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" --title "${GITHUB_REF_NAME}" --generate-notes
